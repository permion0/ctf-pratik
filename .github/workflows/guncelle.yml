name: Kaynakları kontrol et ve siteyi güncelle

on:
  schedule:
    - cron: '*/15 * * * *'      # 15 dakikada bir (GitHub yoğunlukta birkaç dakika geciktirebilir)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                 # tetiklendiği anki değil, en güncel main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kaynakları oku
        run: python scraper/guncelle.py
      - name: Değişiklik varsa kaydet
        id: kayit
        run: |
          git config user.name "pratik-takip"
          git config user.email "pratik-takip@users.noreply.github.com"
          # başka bir çalışma araya girdiyse en güncel main'den yeniden üret ve tekrar dene; olmazsa hata ver
          for deneme in 1 2 3; do
            git add -A kaynak site/data
            if git diff --cached --quiet; then
              echo "degisti=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git commit -q -m "Kaynaklar güncellendi · $(TZ=Europe/Istanbul date '+%d.%m %H:%M')"
            if git push; then
              echo "degisti=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git fetch origin main && git reset --hard origin/main
            python scraper/guncelle.py
          done
          echo "::error::Güncelleme 3 denemede de itilemedi"
          exit 1
      - name: Yayınlama gerekiyor mu
        id: karar
        run: |
          dk=$(date -u +%M)
          if [ "${{ steps.kayit.outputs.degisti }}" = "true" ] || [ "${{ github.event_name }}" != "schedule" ] || [ "$dk" -lt 15 ]; then
            echo "yayinla=true" >> "$GITHUB_OUTPUT"
          else
            echo "yayinla=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.karar.outputs.yayinla == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.karar.outputs.yayinla == 'true'
        with:
          path: site
      - id: yayin
        if: steps.karar.outputs.yayinla == 'true'
        uses: actions/deploy-pages@v4
